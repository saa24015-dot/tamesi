<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>タスク管理アプリ</title>
  <!-- Tailwind CSS (デザイン用) -->
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 min-h-screen text-slate-800 flex flex-col items-center p-4 sm:p-8">

  <div class="w-full max-w-md bg-white rounded-xl shadow-md p-6 space-y-6">
    <!-- ヘッダー / ユーザー情報 -->
    <div class="flex justify-between items-center border-b pb-4">
      <h1 class="text-xl font-bold text-slate-900">Task Manager</h1>
      <div id="userInfo" class="hidden flex items-center gap-2">
        <img id="userAvatar" class="w-8 h-8 rounded-full" src="" alt="Avatar">
        <button id="logoutBtn" class="text-xs bg-slate-200 hover:bg-slate-300 px-2.5 py-1.5 rounded transition">ログアウト</button>
      </div>
    </div>

    <!-- 未ログイン状態の表示 -->
    <div id="loginView" class="text-center py-8 space-y-4">
      <p class="text-slate-600 text-sm">タスクを管理するにはGoogleアカウントでログインしてください。</p>
      <button id="loginBtn" class="w-full flex items-center justify-center gap-2 bg-white border border-slate-300 hover:bg-slate-50 font-medium py-2.5 px-4 rounded-lg shadow-sm transition">
        <svg class="w-5 h-5" viewBox="0 0 24 24">
          <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
          <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
          <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
          <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
        </svg>
        <span>Googleでログイン</span>
      </button>
    </div>

    <!-- ログイン後のメインコンテンツ -->
    <div id="appView" class="hidden space-y-6">
      <!-- タスク追加フォーム -->
      <form id="addTaskForm" class="flex gap-2">
        <input type="text" id="taskInput" placeholder="新しいタスクを入力..." required
          class="flex-1 px-3 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 border-slate-300">
        <button type="submit" class="bg-blue-600 hover:bg-blue-700 text-white font-medium px-4 py-2 rounded-lg transition">追加</button>
      </form>

      <!-- タスク一覧 -->
      <ul id="taskList" class="space-y-2">
        <!-- JSでタスクを生成 -->
      </ul>
    </div>
  </div>

  <!-- Firebase JavaScript SDK (Modular v10) -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import { 
      getAuth, 
      signInWithPopup, 
      GoogleAuthProvider, 
      signOut, 
      onAuthStateChanged 
    } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
    import { 
      getFirestore, 
      collection, 
      addDoc, 
      query, 
      where, 
      onSnapshot, 
      doc, 
      updateDoc, 
      deleteDoc, 
      serverTimestamp,
      orderBy 
    } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

    // 1. Firebaseプロジェクト設定（Consoleから取得した値に置き換えてください）
    const firebaseConfig = {
     apiKey: "AIzaSyBy-EKY6oj7N4-nYe5t8L2WpOPPUnWx84Y",
  authDomain: "tamesi-67271.firebaseapp.com",
  projectId: "tamesi-67271",
  storageBucket: "tamesi-67271.firebasestorage.app",
  messagingSenderId: "844114418972",
  appId: "1:844114418972:web:4fe2f9080abcfc14b8eed9"
    };

    // Firebase 初期化
    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);
    const provider = new GoogleAuthProvider();

    // DOM 要素
    const loginView = document.getElementById('loginView');
    const appView = document.getElementById('appView');
    const userInfo = document.getElementById('userInfo');
    const userAvatar = document.getElementById('userAvatar');
    const loginBtn = document.getElementById('loginBtn');
    const logoutBtn = document.getElementById('logoutBtn');
    const addTaskForm = document.getElementById('addTaskForm');
    const taskInput = document.getElementById('taskInput');
    const taskList = document.getElementById('taskList');

    let currentUser = null;
    let unsubscribeSnapshot = null;

    // 2. 認証状態の監視
    onAuthStateChanged(auth, (user) => {
      if (user) {
        currentUser = user;
        userAvatar.src = user.photoURL || 'https://via.placeholder.com/32';
        loginView.classList.add('hidden');
        appView.classList.remove('hidden');
        userInfo.classList.remove('hidden');
        
        // タスクのリアルタイム監視を開始
        subscribeTasks();
      } else {
        currentUser = null;
        if (unsubscribeSnapshot) unsubscribeSnapshot();
        loginView.classList.remove('hidden');
        appView.classList.add('hidden');
        userInfo.classList.add('hidden');
        taskList.innerHTML = '';
      }
    });

    // ログイン・ログアウト処理
    loginBtn.addEventListener('click', () => signInWithPopup(auth, provider));
    logoutBtn.addEventListener('click', () => signOut(auth));

    // 3. タスク追加
    addTaskForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      const text = taskInput.value.trim();
      if (!text || !currentUser) return;

      try {
        await addDoc(collection(db, 'tasks'), {
          text: text,
          completed: false,
          userId: currentUser.uid,
          createdAt: serverTimestamp()
        });
        taskInput.value = '';
      } catch (error) {
        console.error("タスク追加エラー:", error);
      }
    });

    // 4. 自分のタスク取得（リアルタイム）
    function subscribeTasks() {
      const q = query(
        collection(db, 'tasks'),
        where('userId', '==', currentUser.uid),
        orderBy('createdAt', 'desc')
      );

      unsubscribeSnapshot = onSnapshot(q, (snapshot) => {
        taskList.innerHTML = '';
        if (snapshot.empty) {
          taskList.innerHTML = '<li class="text-center text-slate-400 text-sm py-4">タスクはありません</li>';
          return;
        }

        snapshot.forEach((docSnap) => {
          const task = docSnap.data();
          const taskId = docSnap.id;
          renderTask(taskId, task);
        });
      });
    }

    // タスク描画
    function renderTask(id, task) {
      const li = document.createElement('li');
      li.className = 'flex items-center justify-between bg-slate-50 p-3 rounded-lg border border-slate-200';

      li.innerHTML = `
        <div class="flex items-center gap-3 overflow-hidden">
          <input type="checkbox" ${task.completed ? 'checked' : ''} class="w-4 h-4 text-blue-600 rounded focus:ring-blue-500 cursor-pointer toggle-complete">
          <span class="truncate ${task.completed ? 'line-through text-slate-400' : 'text-slate-700'}">${escapeHtml(task.text)}</span>
        </div>
        <button class="text-red-500 hover:text-red-700 hover:bg-red-50 p-1 rounded transition delete-btn">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>
        </button>
      `;

      // 完了フラグ切替
      li.querySelector('.toggle-complete').addEventListener('change', async (e) => {
        await updateDoc(doc(db, 'tasks', id), {
          completed: e.target.checked
        });
      });

      // 削除
      li.querySelector('.delete-btn').addEventListener('click', async () => {
        await deleteDoc(doc(db, 'tasks', id));
      });

      taskList.appendChild(li);
    }

    // XSS対策用エスケープ関数
    function escapeHtml(str) {
      return str.replace(/[&<>"']/g, (match) => {
        const escapeMap = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' };
        return escapeMap[match];
      });
    }
  </script>
</body>
</html>
